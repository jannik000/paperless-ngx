name: Build Custom Image
# Builds and pushes ghcr.io/<owner>/paperless-ngx images for the personal
# `custom` branch of this fork. Deliberately separate from upstream's
# ci-docker.yml (multi-arch, external registries) to avoid merge conflicts
# on every rebase onto upstream/dev and to keep this simple for a
# single-NAS personal deployment.
on:
  push:
    branches:
      - custom
    tags:
      - 'custom-*'
  workflow_dispatch:
concurrency:
  group: deploy-custom-image-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set repository name
        id: repo
        run: |
          repo_name="${{ github.repository }}"
          repo_name="${repo_name,,}"
          echo "name=${repo_name}" >> "$GITHUB_OUTPUT"
      - name: Determine tags
        id: tags
        env:
          REPO: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
        run: |
          tags=""
          if [[ "${GITHUB_REF}" == refs/tags/custom-* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            tags="${REPO}:${tag_name}"
          else
            short_sha="$(git rev-parse --short HEAD)"
            tags="${REPO}:custom,${REPO}:custom-${short_sha}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Building tags: ${tags}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PNGX_TAG_VERSION=custom
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/cache/app:custom
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/cache/app:custom
